<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    Served under /app/: built with `flutter build web --base-href /app/`
    (see tool/build_web.sh), which replaces the placeholder below.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Axon — تطبيق يربط المريض والطبيب والمهندس حول الجهاز العلاجي">
  <meta name="theme-color" content="#1abc9c">

  <!-- iOS: Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Axon">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Axon</title>

  <style>
    html, body { margin: 0; height: 100%; background: #0A1628; }
    #axon-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: #0A1628; transition: opacity .25s ease-out;
    }
    #axon-loading img { width: 96px; height: 96px; border-radius: 22px; }
    #axon-loading .bar {
      width: 140px; height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(26, 188, 156, .2);
    }
    #axon-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #1abc9c; animation: axon-slide 1.1s ease-in-out infinite;
    }
    @keyframes axon-slide { from { transform: translateX(260%); } to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) { #axon-loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <!-- Shown while the Flutter engine downloads; removed on its first frame. -->
  <div id="axon-loading" aria-label="جارٍ التحميل" role="progressbar">
    <img src="icons/Icon-192.png" alt="Axon">
    <div class="bar"></div>
  </div>
  <script src="loading.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
