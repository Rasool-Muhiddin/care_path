# /etc/nginx/snippets/axon-proxy.conf
proxy_pass http://unix:/run/axon/gunicorn.sock;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# IP العميل وحده (بعد استعادته من CF-Connecting-IP في nginx-cloudflare-realip.conf).
# لا نُلحق X-Forwarded-For القادم من الخارج: يمكن تزويره، وDRF (NUM_PROXIES=1)
# يقرأ آخر قيمة فيه للـ throttling.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
