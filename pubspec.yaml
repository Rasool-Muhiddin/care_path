name: axon
description: تطبيق يربط المريض والطبيب والمهندس حول الأجهزة العلاجية
publish_to: 'none'
version: 0.1.7+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  flutter_riverpod: ^2.5.1

  # التوجيه (Router) مع دعم redirect حسب الدور
  go_router: ^14.2.0

  # التواصل مع الـ API
  dio: ^5.5.0

  # رسم بياني (barplot) لمقارنة الجلسات بالنوبات بشاشة تفاصيل الحالة
  fl_chart: ^0.69.0

  # تخزين آمن للتوكنات — يدعم Android/iOS/macOS/Windows/Linux
  flutter_secure_storage: ^9.2.2

  # قراءة رقم/اسم النسخة الفعلية المثبَّتة على الجهاز (لفحص التحديثات)
  package_info_plus: ^8.0.0

  # فتح رابط تحميل APK أو رابط المتجر عند الضغط على "تحديث الآن"
  url_launcher: ^6.3.0

  # الإشعارات (FCM) — رسائل جديدة في المحادثة
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  # نسخة الويب (PWA): blob التسجيل وعنصر <audio> (voice_platform_web.dart)
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/login_background.jpg
    - assets/images/wall.png
    - assets/images/logo.png

flutter_launcher_icons:
     android: true
     ios: true
     # App Store rejects an iOS 1024 icon with an alpha channel
     remove_alpha_ios: true
     windows:
       generate: true
     # المصدر بالدقة الكاملة (غير مضمَّن في التطبيق)؛ assets/images/logo.png
     # نسخة مصغّرة 512px
     image_path: "assets/branding/logo_source.png"
     # أندرويد 8+: أيقونة متكيّفة — خلفية سوداء كخلفية الشعار، والشعار
     # (أسود مُزال) داخل دائرة الأمان 66dp من 108dp. monochrome لأيقونات
     # أندرويد 13 الملوّنة بثيم النظام.
     adaptive_icon_background: "#000000"
     adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
     adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"
     # الحشوة موجودة في الصورتين أصلاً — بلا inset إضافي (الافتراضي 16%)
     adaptive_icon_foreground_inset: 0    