# /etc/nginx/snippets/axon-web-headers.conf — security headers for the PWA's
# static files (included by axon-web.conf in every web location, because an
# add_header inside a location replaces the ones from outer levels).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

# Content-Security-Policy, in REPORT-ONLY mode first: violations are only
# logged in the browser console (Safari: Develop menu -> iPhone -> Console).
# After a full test on a real iPhone with no CSP messages, switch the header
# name to "Content-Security-Policy" (DEPLOY_AND_TEST_CHECKLIST.md, part G).
# - 'wasm-unsafe-eval': CanvasKit (WebAssembly)
# - www.gstatic.com: Firebase JS SDK, loaded by FlutterFire for web push
# - fonts.gstatic.com: Flutter's fallback fonts for glyphs the bundled font
#   lacks (e.g. emoji)
# - *.googleapis.com: Firebase installations / FCM token registration
# - blob:/data: media: voice notes (in-memory blobs), audio unlock (data:)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://www.gstatic.com https://*.googleapis.com; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
