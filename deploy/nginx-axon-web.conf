# /etc/nginx/snippets/axon-web.conf
# The Flutter Web PWA at https://axon.tera-software1.com/app/
# Include it inside axon's server block(s), BEFORE "location / { ... }":
#     include /etc/nginx/snippets/axon-web.conf;
# Every other path (/api/, /admin/, /static/, /media/, /privacy/, ...) still
# goes to Django exactly as before. Django has no /app/ URL and no
# /firebase-messaging-sw.js URL (config/test_web_paths.py checks this).
#
# /var/www/axon/web is a symlink to the current release folder
# (/var/www/axon/web-releases/<timestamp>); rollback = point it back.
#
# Caching: no file of the Flutter build has a content hash in its name, so
# everything is revalidated on each load ("no-cache" = use the cached copy
# only after a cheap 304 check). Fonts and icons rarely change: 7 days.

location = /app {
    return 301 /app/;
}

location /app/fonts/ {
    alias /var/www/axon/web/fonts/;
    # nginx's mime.types has no .ttf: without this, octet-stream (never gzipped)
    types { font/ttf ttf; text/plain txt; }
    include /etc/nginx/snippets/axon-web-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
}

location /app/icons/ {
    alias /var/www/axon/web/icons/;
    include /etc/nginx/snippets/axon-web-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
}

location /app/ {
    alias /var/www/axon/web/;
    # Hash routing (/app/#/...) never needs this, but a reload on an unknown
    # path under /app/ still opens the app instead of a 404.
    try_files $uri $uri/ /app/index.html;
    include /etc/nginx/snippets/axon-web-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Web Push service worker. The Firebase JS SDK always registers it from the
# domain ROOT (scope /firebase-cloud-messaging-push-scope), not under /app/.
location = /firebase-messaging-sw.js {
    alias /var/www/axon/web/firebase-messaging-sw.js;
    default_type application/javascript;
    include /etc/nginx/snippets/axon-web-headers.conf;
    add_header Cache-Control "no-cache" always;
}
