# /etc/nginx/sites-available/axon   (ثم: ln -s إلى sites-enabled)
# استبدل axon.tera-software1.com بالدومين الفعلي. certbot سيضيف كتلة 443 ويعدّل هذا الملف.

limit_req_zone $binary_remote_addr zone=axon_login:10m rate=10r/m;

# يعرّف $axon_from_cloudflare (1 = الطلب جاء من خوادم Cloudflare). يُستخدم في
# كتلة 443 فقط: بعد certbot أضف داخل server { listen 443 ... } لـ axon السطر
#     include /etc/nginx/snippets/axon-cloudflare-only.conf;
# لا تضفه في كتلة المنفذ 80 أدناه. راجع SERVER_SETUP.md (الخطوة 9).
include /etc/nginx/snippets/axon-cloudflare-geo.conf;

server {
    listen 80;
    listen [::]:80;
    server_name axon.tera-software1.com;

    # IP العميل الحقيقي خلف Cloudflare (يجب أن يسبق limit_req والـ proxy)
    include /etc/nginx/snippets/axon-cloudflare-realip.conf;

    # ضغط ردود الـ API (JSON) وملفات لوحة الأدمن. text/html مضغوط افتراضياً.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain;

    # حجم الرفع: ملفات APK من لوحة الأدمن
    client_max_body_size 200m;

    # ملفات ثابتة ومرفوعة يقدّمها nginx مباشرة
    location /static/ {
        alias /var/www/axon/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /var/www/axon/media/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # الرسائل الصوتية للمحادثة (ملفات طبية خاصة): internal = لا يصلها أي طلب
    # من الخارج. Django يفحص صلاحية القارئ في /api/chat/messages/<id>/audio/ ثم
    # يرد بـ X-Accel-Redirect: /_protected/voice/<اسم الملف> فيقدّمه nginx.
    # المجلد خارج /var/www/axon/media فلا يصله /media/ أيضاً.
    location /_protected/voice/ {
        internal;
        alias /var/www/axon/private/voice/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # حد إضافي على تسجيل الدخول (10 محاولات/دقيقة لكل IP، مع سماحية 5)
    location = /api/auth/login/ {
        limit_req zone=axon_login burst=5 nodelay;
        include /etc/nginx/snippets/axon-proxy.conf;
    }

    # لوحة Django admin خلف كلمة مرور إضافية (HTTP Basic Auth) قبل شاشة دخول
    # Django نفسها. أنشئ الملف بـ: sudo htpasswd -c /etc/nginx/axon-admin.htpasswd <اسم>
    # بديل أقوى إن كان لديكم IP ثابت: استبدل سطري auth_basic بـ
    #   allow <IP_المكتب>; deny all;
    location /admin/ {
        auth_basic "Axon admin";
        auth_basic_user_file /etc/nginx/axon-admin.htpasswd;
        include /etc/nginx/snippets/axon-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/axon-proxy.conf;
    }

    server_tokens off;
}