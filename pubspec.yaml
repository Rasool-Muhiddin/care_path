name: axon
description: تطبيق يربط المريض والطبيب والمهندس حول الأجهزة العلاجية
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  flutter_riverpod: ^2.5.1

  # التوجيه (Router) مع دعم redirect حسب الدور
  go_router: ^14.2.0

  # التواصل مع الـ API
  dio: ^5.5.0

  # رسم بياني (barplot) لمقارنة الجلسات بالنوبات بشاشة تفاصيل الحالة
  fl_chart: ^0.69.0

  # تخزين آمن للتوكنات — يدعم Android/iOS/macOS/Windows/Linux
  flutter_secure_storage: ^9.2.2

  # قراءة رقم/اسم النسخة الفعلية المثبَّتة على الجهاز (لفحص التحديثات)
  package_info_plus: ^8.0.0

  # فتح رابط تحميل APK أو رابط المتجر عند الضغط على "تحديث الآن"
  url_launcher: ^6.3.0

  # الإشعارات (FCM) — رسائل جديدة في المحادثة
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/login_background.jpg
    - assets/images/wall.png
    - assets/images/logo.png

flutter_launcher_icons:
     android: true
     ios: true
     windows:
       generate: true
     image_path: "assets/images/logo.png"    