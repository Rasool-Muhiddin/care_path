# /etc/nginx/snippets/axon-cloudflare-only.conf
# يُضمَّن داخل كتلة server الخاصة بـ 443 لـ axon فقط (التي أنشأها certbot)،
# وليس في كتلة المنفذ 80. يتطلب axon-cloudflare-geo.conf في أعلى ملف الموقع.
#
# أي طلب لم يمر عبر Cloudflare (اتصال مباشر بـ IP السيرفر) يُغلق بلا رد (444).
# تحذير: سجل DNS لـ axon يجب أن يكون Proxied (سحابة برتقالية)، وإلا فكل
# الطلبات تأتي مباشرة وتُرفض كلها بـ 444.
if ($axon_from_cloudflare = 0) {
    return 444;
}
